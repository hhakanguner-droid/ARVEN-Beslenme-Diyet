name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/**]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Validate database migration contracts
        run: python3 scripts/validate_migration.py
      - name: Validate review 8 database contracts
        run: python3 scripts/validate_review8.py
      - name: Validate review 9 database contracts
        run: python3 scripts/validate_review9.py
      - name: Validate review 10 database contracts
        run: python3 scripts/validate_review10.py
      - name: Validate review 11 database contracts
        run: python3 scripts/validate_review11.py
      - name: Production build
        run: npm run build
