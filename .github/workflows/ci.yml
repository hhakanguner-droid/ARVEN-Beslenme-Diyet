name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/**]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bootstrap lockfile snapshot
        run: |
          echo 'ARVEN_LOCKFILE_BEGIN'
          base64 -w 0 package-lock.json
          echo
          echo 'ARVEN_LOCKFILE_END'
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
