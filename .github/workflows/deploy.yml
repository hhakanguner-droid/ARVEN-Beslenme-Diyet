name: Deploy
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Refuse to deploy anything except main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::workflow_dispatch was run on '${{ github.ref }}', not main. Production deploys must run from the reviewed main branch."
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and boundary tests
        run: npm test
      - name: Validate clean V1 persistence baseline
        run: python3 scripts/validate_migration.py
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
