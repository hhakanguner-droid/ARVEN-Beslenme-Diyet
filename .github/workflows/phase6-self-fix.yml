name: Phase6 Self Fix

on:
  push:
    branches:
      - fix/phase6-security-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase6-security-hardening
          fetch-depth: 0
      - name: Apply targeted hardening patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/persistence/v1-boundary.ts')
          s = p.read_text()
          s = s.replace(
              'import { assertNoAllergyConflict, assertNoDietaryExclusionConflict, type AllergenSafetyExclusion, type DietarySafetyExclusion } from "@/lib/health-safety/policy";',
              'import { assertNoAllergyConflict, assertNoDietaryExclusionConflict, assertNoMedicalOverreach, type AllergenSafetyExclusion, type DietarySafetyExclusion } from "@/lib/health-safety/policy";\nimport { isKnownSupplementName } from "@/lib/supplements/reference";'
          )
          old = '''    const rows:StoredLabResultEntry[]=entries.map((entry)=>{\n      const x=LabExtractedEntryInput.parse(entry);\n      return {id:this.idFactory(),userSubject:this.subject,labDocumentId:parsedDocumentId,markerName:x.markerName,valueText:x.valueText,unitText:x.unitText,referenceRangeText:x.referenceRangeText,status:"extracted" as const,createdAt:now};\n    });'''
          new = '''    const rows:StoredLabResultEntry[]=entries.map((entry)=>{\n      const x=LabExtractedEntryInput.parse(entry);\n      for(const value of [x.markerName,x.valueText,x.unitText,x.referenceRangeText]){if(value!=null)assertNoMedicalOverreach(value);}\n      return {id:this.idFactory(),userSubject:this.subject,labDocumentId:parsedDocumentId,markerName:x.markerName,valueText:x.valueText,unitText:x.unitText,referenceRangeText:x.referenceRangeText,status:"extracted" as const,createdAt:now};\n    });'''
          if old not in s:
              raise SystemExit('recordLabResultEntries target not found')
          s = s.replace(old, new)
          old = '''  async recordSupplement(input:unknown):Promise<StoredSupplementRecord>{\n    const x=SupplementRecordInput.parse(input);\n    const record:StoredSupplementRecord={id:this.idFactory(),userSubject:this.subject,foodVersionId:x.foodVersionId,name:x.name,note:x.note,isActive:true,createdAt:instant(this.clock.now())};'''
          new = '''  async recordSupplement(input:unknown):Promise<StoredSupplementRecord>{\n    const x=SupplementRecordInput.parse(input);\n    if(!isKnownSupplementName(x.name))throw new ApplicationRejectedError("unverified-supplement-name","Supplement name is not in the curated supplement reference");\n    const record:StoredSupplementRecord={id:this.idFactory(),userSubject:this.subject,foodVersionId:x.foodVersionId,name:x.name,note:x.note,isActive:true,createdAt:instant(this.clock.now())};'''
          if old not in s:
              raise SystemExit('recordSupplement target not found')
          p.write_text(s)

          p = Path('lib/persistence/durable-object-adapter.ts')
          s = p.read_text()
          old = '''  async confirmLabResultEntry(userSubject: string, id: string, edited: { markerName: string; valueText: string; unitText: string | null; referenceRangeText: string | null }): Promise<StoredLabResultEntry> {\n    this.sql.exec(\n      "UPDATE lab_result_entries SET marker_name=?, value_text=?, unit_text=?, reference_range_text=?, status='confirmed' WHERE id=? AND user_subject=?",\n      edited.markerName, edited.valueText, edited.unitText, edited.referenceRangeText, id, userSubject,\n    );\n    const row = this.sql.exec("SELECT * FROM lab_result_entries WHERE id=? AND user_subject=?", id, userSubject).one();\n    if (!row) throw new Error("Lab result entry not found");\n    return mapLabResultEntry(row);\n  }'''
          new = '''  async confirmLabResultEntry(userSubject: string, id: string, edited: { markerName: string; valueText: string; unitText: string | null; referenceRangeText: string | null }): Promise<StoredLabResultEntry> {\n    const existingRow = this.sql.exec("SELECT * FROM lab_result_entries WHERE id=? AND user_subject=?", id, userSubject).one();\n    if (!existingRow) throw new Error("Lab result entry not found");\n    const existing = mapLabResultEntry(existingRow);\n    if (existing.status === "confirmed") {\n      const identical = existing.markerName === edited.markerName && existing.valueText === edited.valueText && existing.unitText === edited.unitText && existing.referenceRangeText === edited.referenceRangeText;\n      if (identical) return existing;\n      throw new Error("Confirmed lab result entries are immutable; create a new correction instead");\n    }\n    this.sql.exec(\n      "UPDATE lab_result_entries SET marker_name=?, value_text=?, unit_text=?, reference_range_text=?, status='confirmed' WHERE id=? AND user_subject=?",\n      edited.markerName, edited.valueText, edited.unitText, edited.referenceRangeText, id, userSubject,\n    );\n    const row = this.sql.exec("SELECT * FROM lab_result_entries WHERE id=? AND user_subject=?", id, userSubject).one();\n    if (!row) throw new Error("Lab result entry not found");\n    return mapLabResultEntry(row);\n  }'''
          if old not in s:
              raise SystemExit('confirmLabResultEntry target not found')
          s = s.replace(old, new)
          p.write_text(s)

          # Remove this one-shot workflow from the resulting commit so it never ships to main.
          Path('.github/workflows/phase6-self-fix.yml').unlink()
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Harden Phase 6 mutation boundaries and confirmation retries"
          git push origin HEAD:fix/phase6-security-hardening
